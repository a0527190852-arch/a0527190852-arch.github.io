<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1a1d26;--muted:#6b7280;--accent:#2563eb;--line:#e5e7eb;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1b1e26;--text:#eef0f5;--muted:#9aa1b0;--accent:#6ea0ff;--line:#2d313c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111318;--card:#1b1e26;--text:#eef0f5;--muted:#9aa1b0;--accent:#6ea0ff;--line:#2d313c;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font-size:1rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:6px}
.er{border-bottom:1px solid var(--line);padding:10px 0}
.nm{display:grid;grid-template-columns:1fr auto;gap:8px}
button{font-size:1rem;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer;margin-top:8px}
button.alt{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.x{background:transparent;color:var(--muted);padding:6px 10px;font-size:1.2rem;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tabs button{margin:0;background:var(--card);color:var(--text);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sum{font-size:.95rem;color:var(--muted);margin:8px 0}
.sum b{color:var(--text)}
.res{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px}
.res small{color:var(--muted);display:block}
.amt{font-size:1.2rem;font-weight:700;color:var(--ok);white-space:nowrap}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:2px solid var(--line);padding-top:10px}
.hm{border-top:1px solid var(--line);padding:10px 0}.hm .top{display:flex;justify-content:space-between;font-weight:700}.hm .det{color:var(--muted);font-size:.9rem;margin:4px 0}
.hm button{padding:6px 10px;font-size:.85rem;margin-inline-end:6px}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.45}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:22px;padding:18px 20px;margin:6px 0 18px;box-shadow:0 10px 28px rgba(79,70,229,.30)}
.hero .ic{font-size:2rem;background:rgba(255,255,255,.18);width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.hero h1{margin:0;font-size:1.45rem;font-weight:700;color:#fff}
.hero p{margin:2px 0 0;font-size:.9rem;opacity:.85}
.card{border-radius:20px;box-shadow:0 4px 18px rgba(20,30,60,.08);padding:16px}
label{font-weight:500;letter-spacing:.2px;margin-bottom:6px}
input,select{border-radius:12px;padding:12px;border:1.5px solid var(--line);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.22)}
button{background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:12px;font-family:inherit;font-weight:500;box-shadow:0 4px 12px rgba(79,70,229,.25);transition:transform .1s,opacity .15s}
button:active{transform:scale(.97)}
button.alt,button.x,.tabs button{box-shadow:none}
.tabs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;gap:5px}
.tabs button{border:0;background:transparent;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.res{border-top:1px dashed var(--line);align-items:center}
.res small{font-size:.82rem;margin-top:2px}
.amt{background:rgba(34,197,94,.14);padding:4px 12px;border-radius:999px;font-size:1.05rem}
.total{background:var(--bg);border:0;border-radius:14px;padding:14px;margin-top:10px;font-size:1.1rem}
.total span:last-child{color:var(--ok)}
.hm{border-top:1px dashed var(--line)}
.er{border-bottom:1px dashed var(--line)}
html:root:not([data-theme="x"]){--bg:#0d0d0f;--card:#17171b;--text:#f3ede0;--muted:#a49b86;--accent:#d4af37;--line:#2c2a22;--ok:#e6c35c;color-scheme:dark}
body{background:radial-gradient(900px 420px at 50% -120px,rgba(212,175,55,.16),transparent) var(--bg) no-repeat}
.hero{background:linear-gradient(135deg,#221d0c,#0d0d0f);border:1px solid rgba(212,175,55,.45);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.hero .ic{background:linear-gradient(135deg,#f5d66b,#b8860b);box-shadow:0 4px 14px rgba(212,175,55,.35)}
.hero h1{color:#f5d66b;letter-spacing:.3px}
.hero p{color:#cbbf9d;opacity:1}
.card{box-shadow:0 6px 22px rgba(0,0,0,.45);border-color:#2c2a22}
label{color:#b9ae92}
input:focus,select:focus{box-shadow:0 0 0 3px rgba(212,175,55,.25)}
button{background:linear-gradient(135deg,#f5d66b,#b8860b);color:#1a1405;font-weight:700;box-shadow:0 4px 14px rgba(212,175,55,.25)}
.tabs button.on{background:linear-gradient(135deg,#f5d66b,#b8860b);color:#1a1405;box-shadow:0 4px 14px rgba(212,175,55,.25)}
.amt{background:rgba(212,175,55,.14);color:#f5d66b;border:1px solid rgba(212,175,55,.3)}
.total{background:#101013;border:1px solid rgba(212,175,55,.25)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.mbox{background:var(--card);border:1px solid rgba(212,175,55,.45);border-radius:20px;padding:18px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.mbox.big{max-height:88vh;overflow:auto}
.mbox.wide{max-width:520px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 10px;margin:0;font-size:1rem;background:var(--card);color:var(--text);border:1px solid rgba(212,175,55,.35);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tile span{font-size:2rem;line-height:1}
.tile:last-child{grid-column:1/-1}
.mbox input{margin-top:8px}
.total span:last-child{color:#f5d66b}
textarea{width:100%;font-family:inherit;font-size:1rem;padding:12px;margin-top:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,175,55,.25)}

html:root:not([data-theme="x"]){--bg:#faf6ee;--card:#fff;--text:#0f3f5c;--muted:#7a7468;--accent:#0d5075;--line:#ebe3d2;--ok:#0d5075;color-scheme:light}
body{background:radial-gradient(700px 380px at 50% 0,#f3ead6,transparent) var(--bg) no-repeat}
.brand{text-align:center;margin:8px 0 16px}
.kicker{display:flex;align-items:center;justify-content:center;gap:12px;color:#a98418;font-weight:700;font-size:.95rem;letter-spacing:.3px}
.kicker i{display:block;width:44px;height:2px;background:#c9a227;opacity:.8}
.logo{font-family:'Frank Ruhl Libre',serif;font-size:3.4rem;line-height:1.1;margin-top:10px;font-weight:700}
.logo .b{color:#0d5075}.logo .g{color:#c9a227;font-style:italic;margin-inline-start:4px}
.greet{font-family:'Frank Ruhl Libre',serif;text-align:center;font-size:1.7rem;font-weight:700;color:#0f3f5c;margin:6px 0 4px}
.subt{text-align:center;color:var(--muted);font-size:1.05rem;margin-bottom:22px}
.card{border-color:var(--line);box-shadow:0 2px 10px rgba(80,60,20,.06)}
label{color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:#0d5075;box-shadow:0 0 0 3px rgba(13,80,117,.18)}
button{background:#0d5075;color:#fff;box-shadow:none;font-weight:700}
.amt{background:rgba(13,80,117,.08);color:#0d5075;border:1px solid rgba(13,80,117,.2)}
.total{background:#f6f0e2;border:1px solid var(--line)}
.total span:last-child{color:#0d5075}
.modal{background:rgba(15,40,60,.5)}
.mbox{border-color:var(--line);box-shadow:0 20px 50px rgba(15,40,60,.3)}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin-bottom:18px;padding-bottom:10px}
.opt{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 16px 18px;box-shadow:0 2px 10px rgba(80,60,20,.06);cursor:pointer}
.opt:last-child{grid-column:1/-1}
.otop{display:flex;justify-content:space-between;align-items:center}
.code{color:#a98418;font-weight:700;letter-spacing:1.5px;direction:ltr}
.rad{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:#fbf8f1}
.otitle{font-family:'Frank Ruhl Libre',serif;font-size:1.35rem;font-weight:700;color:#0f3f5c;margin:14px 0 16px;line-height:1.2}
.opt button{width:100%;margin:0;padding:14px 8px;border-radius:10px;font-size:1rem;pointer-events:none}
.ico{position:absolute;left:-12px;bottom:-14px;width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(80,60,20,.15);display:grid;place-items:center;font-size:1.4rem}
.logoimg{display:block;margin:6px auto 4px;max-width:80%;height:auto}
.brand{margin:14px 0 18px}
</style>

<script>
/* אחסון מקומי לאתר רגיל: הנתונים נשמרים בדפדפן הזה בלבד */
if(!window.claude){window.__local=true;window.claude={use:async function(n){if(n!=='db')return null;
 var P='bonusdb:';
 return {collection:function(c){return {doc:function(id){var k=P+c+'/'+id;return {
  get:async function(){var v=localStorage.getItem(k);return {exists:v!==null,data:function(){return JSON.parse(v)}}},
  set:async function(d){localStorage.setItem(k,JSON.stringify(d))},
  delete:async function(){localStorage.removeItem(k)}}}}}}}}}
</script>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(x){return x.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2})}
function mlabel(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'})}
function app(h){$('app').innerHTML=h}
function say(t){var m=$('msg');if(m)m.textContent=t}
var te=new TextEncoder(),td=new TextDecoder();
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function dkey(pw,salt){var k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,pw){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));var k=await dkey(pw,salt);var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,te.encode(JSON.stringify(obj)));return {s:b64(salt),i:b64(iv),c:b64(ct)}}
async function unseal(d,pw){var k=await dkey(pw,ub64(d.s));var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.i)},k,ub64(d.c));return JSON.parse(td.decode(pt))}
function newKey(){return b64(crypto.getRandomValues(new Uint8Array(32)))}
async function sealK(obj,k){var iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.importKey('raw',ub64(k),'AES-GCM',false,['encrypt']);var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,te.encode(JSON.stringify(obj)));return {i:b64(iv),c:b64(ct)}}
async function unsealK(d,k){var key=await crypto.subtle.importKey('raw',ub64(k),'AES-GCM',false,['decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.i)},key,ub64(d.c));return JSON.parse(td.decode(pt))}
async function getDoc(n){var s=await col.doc(n).get();return s.exists?s.data():null}

var col2=null,col3=null,nets={},nt;var col=null,S=null,adminPw=null,gone=[],tabNow='emp',cur={};
var d0=new Date();
function newCur(){cur={sold:0,excl:0,hours:{},month:d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')}}
newCur();

function calcMonth(mo){var items=Math.max(mo.sold-mo.excl,0),th=mo.rows.reduce(function(s,r){return s+r.h},0);
 var rows=mo.rows.map(function(r){var p=th?r.h/th:0;return {id:r.id,n:r.n,h:r.h,r:r.r,pct:p*100,items:items*p,amt:items*p*r.r}});
 return {items:items,th:th,rows:rows,total:rows.reduce(function(s,x){return s+x.amt},0)}}
function curMonth(){return {sold:cur.sold||0,excl:cur.excl||0,rows:S.emps.map(function(e){return {id:e.id,n:e.n||'ללא שם',h:cur.hours[e.id]||0,r:e.r||0}})}}

async function saveAll(){
 var list=[];
 for(var i=0;i<S.emps.length;i++){var e=S.emps[i];
  if(!e.k)e.k=newKey();
  if(e.pw){await col3.doc(e.id).set(await seal({k:e.k},e.pw));e.has=true;e.pw=''}
  if(e.has)list.push({id:e.id,n:e.n})}
 await col.doc('admin').set(await seal(S,adminPw));
 await col.doc('index').set({list:list});
 var months=Object.keys(S.months).sort();
 for(var i2=0;i2<S.emps.length;i2++){var e2=S.emps[i2];
  if(e2.has){var ms=[];months.forEach(function(m){var rw=calcMonth(S.months[m]).rows.filter(function(x){return x.id===e2.id})[0];if(rw)ms.push({month:m,h:rw.h,pct:rw.pct,items:rw.items,amt:rw.amt})});
   await col.doc('e_'+e2.id).set(await sealK({n:e2.n,months:ms,msgs:(S.msgs||[]).filter(function(m){return m.to==='all'||m.to===e2.id})},e2.k))}
  else{try{await col.doc('e_'+e2.id).delete()}catch(x){}}}
 for(var j=0;j<gone.length;j++){try{await col.doc('e_'+gone[j]).delete()}catch(x){}try{await col3.doc(gone[j]).delete()}catch(x){}try{await col2.doc(gone[j]).delete()}catch(x){}}
 gone=[];
 document.querySelectorAll('[data-f="pw"]').forEach(function(i){i.value=''});
}

async function init(){
 app('<div class="card sum">טוען…</div>');
 try{
  var db=window.claude&&await claude.use('db');
  if(!db){app('<div class="card sum">האחסון בדפדפן לא זמין. נסה דפדפן אחר או חלון רגיל (לא פרטי).</div>');return}
  col=db.collection('pay');col2=db.collection('pay_in');col3=db.collection('pay_w');showLogin('emp');
 }catch(e){app('<div class="card sum">שגיאה בטעינה, נסה לרענן.</div>')}
}
async function showLogin(tab,msg){
 app('<div class="card"><label>שם משתמש</label><input id="un" autocomplete="username" placeholder="שם מלא"><label style="margin-top:10px">סיסמה</label><input id="pw" type="password" autocomplete="current-password"><button data-a="go" style="width:100%">כניסה</button><div id="msg" class="sum">'+esc(msg||'')+'</div>'+'</div>');
}
function norm(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase()}
async function doLogin(){
 var un=norm($('un').value),pw=$('pw').value;
 if(!un||!pw){say('הזן שם משתמש וסיסמה');return}
 say('בודק…');
 try{
  var gen=(un==='מנהל'||un==='admin');
  if(gen||un===norm('אהרן משה קוביטשעק')){
   var ad=await getDoc('admin');
   if(ad){var okA=true;try{S=await unseal(ad,pw)}catch(e){okA=false}
    if(okA){adminPw=pw;gone=[];newCur();say('טוען נתונים…');await loadNets();showAdmin();return}
    if(gen){say('שם משתמש או סיסמה שגויים');return}
   }else{
    if(pw.length<6){say('סיסמת מנהל: לפחות 6 תווים');return}
    S={emps:[{id:'m1',n:'אהרן משה קוביטשעק',r:2.5,pw:''},{id:'m2',n:'דודי בירנבאום',r:1.5,pw:''},{id:'m3',n:'חן זבילי',r:1.5,pw:''},{id:'m4',n:'אברהם ענדן',r:1.5,pw:''}],months:{}};
    adminPw=pw;
    try{await saveAll()}catch(e){S=null;say('אין הרשאת כתיבה: רק הבעלים של האפליקציה יכול להגדיר');return}
    newCur();showAdmin();return}
  }
  var ix=await getDoc('index'),l=ix?ix.list:[];
  var u=l.filter(function(x){return norm(x.n)===un})[0];
  if(!u){say('שם משתמש או סיסמה שגויים');return}
  var wr=await col3.doc(u.id).get();if(!wr.exists){say('שם משתמש או סיסמה שגויים');return}
  var kk;try{kk=(await unseal(wr.data(),pw)).k}catch(e){say('שם משתמש או סיסמה שגויים');return}
  var d=await getDoc('e_'+u.id);if(!d){say('אין נתונים עדיין');return}
  var data;try{data=await unsealK(d,kk)}catch(e){say('שגיאה בנתונים');return}
  var n0={};try{var s2=await col2.doc(u.id).get();if(s2.exists)n0=(await unsealK(s2.data(),kk)).nets||{}}catch(e2){}
  showEmp(data,u.id,kk,n0);
 }catch(e){say('שגיאה, נסה שוב')}
}
var emp=null;
function msgCard(d){var m=(d.msgs||[]).slice().sort(function(a,b){return b.t-a.t});if(!m.length)return '';return '<div class="card"><label>הודעות מהמנהל</label>'+m.map(function(x){return '<div class="hm"><div class="det">'+esc(new Date(x.t).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'}))+(x.to==='all'?' · לכולם':' · אישית')+'</div><div style="white-space:pre-wrap">'+esc(x.text)+'</div></div>'}).join('')+'</div>'}
function renderMsgs(){var bx=$('mlist');if(!bx)return;var m=(S.msgs||[]).slice().sort(function(a,b){return b.t-a.t});bx.innerHTML=m.map(function(x){var to=x.to==='all'?'כולם':((S.emps.filter(function(e){return e.id===x.to})[0]||{}).n||'עובד שהוסר');return '<div class="hm"><div class="det">'+esc(new Date(x.t).toLocaleDateString('he-IL'))+' · אל: '+esc(to)+'</div><div style="white-space:pre-wrap">'+esc(x.text)+'</div><button class="alt" data-a="delmsg" data-id="'+esc(x.id)+'">מחק</button></div>'}).join('')}
async function loadNets(){nets={};if(!S)return;for(var i=0;i<S.emps.length;i++){var e=S.emps[i];if(!e.has||!e.k)continue;try{var s=await col2.doc(e.id).get();if(s.exists){var o=await unsealK(s.data(),e.k);nets[e.id]=o.nets||{}}}catch(x){}}}
function getNet(m){var v=emp.nets[m];if(v!=null)return v;try{return parseFloat(localStorage.getItem('net:'+emp.id+':'+m))||0}catch(e){return 0}}
function updEmp(){var sn=0,sh=0;emp.d.months.forEach(function(x){var n=getNet(x.month),el=$('ph'+x.month),ok=n>0&&x.h>0;if(el)el.textContent=ok?'סה״כ לשעה: '+fmt((n+x.amt)/x.h)+' ₪ (שכר '+fmt(n)+' + בונוס '+fmt(x.amt)+')':(n>0?'אין שעות רשומות לחודש הזה, לא ניתן לחשב לשעה':'');if(ok){sn+=n+x.amt;sh+=x.h}});var a=$('avg');if(a)a.textContent=sh?fmt(sn/sh)+' ₪':'—'}
function netIn(t){var v=parseFloat(t.value)||0,m=t.dataset.m;emp.nets[m]=v;try{localStorage.setItem('net:'+emp.id+':'+m,String(v))}catch(e){}updEmp();if($('nmsg'))$('nmsg').textContent='שומר…';clearTimeout(nt);nt=setTimeout(async function(){try{await col2.doc(emp.id).set(await sealK({nets:emp.nets},emp.k));if($('nmsg'))$('nmsg').textContent='נשמר'}catch(e){if($('nmsg'))$('nmsg').textContent='לא נשמר בשרת ('+((e&&(e.code||e.message))||'שגיאה')+'), נשמר במכשיר בלבד'}},900)}
function showEmp(d,id,k,n0){emp={id:id,d:d,k:k,nets:n0||{}};
 var ms=d.months.slice().sort(function(a,b){return a.month<b.month?1:-1}),tot=ms.reduce(function(s,x){return s+x.amt},0);
 var h='<div class="card"><div class="sum">שלום <b>'+esc(d.n)+'</b></div><div class="total"><span>סה״כ מצטבר</span><span>'+fmt(tot)+' ₪</span></div><div class="total"><span>ממוצע לשעה (שכר + בונוס)</span><span id="avg">—</span></div></div><div class="card"><label>לפי חודשים · הזן שכר נטו כדי לראות כמה קיבלת לשעה</label>';
 if(!ms.length)h+='<div class="sum">עוד אין חודשים.</div>';
 ms.forEach(function(x){h+='<div class="hm"><div class="top"><span>'+esc(mlabel(x.month))+'</span><span class="amt">בונוס '+fmt(x.amt)+' ₪</span></div><div class="det">'+x.h+' שעות · '+x.pct.toFixed(1)+'% · '+x.items.toFixed(1)+' פריטים</div><label style="margin-top:8px">שכר נטו שקיבלתי החודש (₪)</label><input data-f="net" data-m="'+x.month+'" type="number" inputmode="decimal" value="'+(getNet(x.month)||'')+'"><div class="sum" id="ph'+x.month+'"></div></div>'});
 app('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="alt" data-a="pwopen" style="margin:0">🔑 החלפת סיסמה</button><button class="alt" data-a="histopen" style="margin:0">📜 היסטוריה</button></div>'+msgCard(d)+h+'<div class="sum">השכר נשמר מוצפן ונראה רק לך ולמנהל.</div><div class="sum" id="nmsg"></div></div><button class="alt" data-a="out" style="width:100%">יציאה</button>');updEmp();
}
function modal(html){var o=$('modal');if(o)o.remove();var m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<div class="mbox big wide">'+html+'<button data-a="pwclose" class="alt" style="width:100%;margin-top:12px">סגור</button></div>';$('app').appendChild(m)}
function showAdmin(){
 var t=[['calc','📅','חישוב החודש','C – 01'],['emps','👥','עובדים ותעריפים','E – 02'],['adm','📜','היסטוריה','H – 03'],['msgs','✉️','הודעות','M – 04'],['sett','🔐','סיסמת מנהל','S – 05']];
 app('<div class="greet">שלום, רבי עקיבא</div><div class="subt">בחרו פעולה כדי להתחיל</div><div class="optgrid">'+t.map(function(x){return '<div class="opt" data-a="o_'+x[0]+'"><div class="otop"><span class="code">'+x[3]+'</span><span class="rad"></span></div><div class="otitle">'+x[2]+'</div><button type="button">פתיחה</button><div class="ico">'+x[1]+'</div></div>'}).join('')+'</div><button class="alt" data-a="out" style="width:100%">יציאה</button>');
}
function ttl(x){return '<div style="font-size:1.15rem;font-weight:700;margin-bottom:10px">'+x+'</div>'}
function calc(){
 if(!$('out'))return;
 var r=calcMonth(curMonth());
 var h='<div class="sum">פריטים לחלוקה: <b>'+r.items+'</b> · סה״כ שעות: <b>'+r.th+'</b></div>';
 r.rows.forEach(function(x){h+='<div class="res"><div>'+esc(x.n)+'<small>'+x.h+' שעות · '+x.pct.toFixed(1)+'% · '+x.items.toFixed(1)+' פריטים × '+x.r+' ₪</small></div><div class="amt">'+fmt(x.amt)+' ₪</div></div>'});
 $('out').innerHTML=h+'<div class="total"><span>סה״כ לתשלום</span><span>'+fmt(r.total)+' ₪</span></div>';
}
function renderHist(){
 var ms=Object.keys(S.months).sort().reverse(),box=$('hist');if(!box)return;
 if(!ms.length){box.innerHTML='<label>היסטוריה</label><div class="sum">עוד לא נשמרו חודשים.</div>';return}
 var tot={},nm={};ms.forEach(function(m){calcMonth(S.months[m]).rows.forEach(function(x){tot[x.id]=(tot[x.id]||0)+x.amt;nm[x.id]=x.n})});
 var h='<label>סה״כ מצטבר לכל עובד</label>';
 Object.keys(tot).forEach(function(id){h+='<div class="res" style="padding:6px 0"><div>'+esc(nm[id])+'</div><div class="amt" style="font-size:1rem">'+fmt(tot[id])+' ₪</div></div>'});
 h+='<label style="margin-top:14px">לפי חודשים</label>';
 ms.forEach(function(m){var r=calcMonth(S.months[m]);h+='<div class="hm"><div class="top"><span>'+esc(mlabel(m))+'</span><span>'+fmt(r.total)+' ₪</span></div><div class="det">'+r.rows.map(function(x){var nt=(nets[x.id]||{})[m]||0;return esc(x.n)+': בונוס '+fmt(x.amt)+' ₪ ('+x.r+' לפריט)'+(nt?' · נטו '+fmt(nt)+' ₪ · סה״כ לשעה '+(x.h?fmt((nt+x.amt)/x.h):'—')+' ₪':'')}).join('<br>')+'</div><button data-a="edit" data-m="'+m+'">✏️ ערוך</button><button class="alt" data-a="load" data-m="'+m+'">טען לחישוב</button><button class="alt" data-a="rm" data-m="'+m+'">מחק</button></div>'});
 box.innerHTML=h+'<button class="alt" data-a="refresh">רענן שכרים מהעובדים</button>';
}
$('app').oninput=function(ev){var t=ev.target,f=t.dataset.f;if(t.dataset.e){editPrev();return}if(f==='net'){netIn(t);return}if(f==='hf'){histBody(t.value);return}if(!f||!S)return;
 if(f==='sold'||f==='excl')cur[f]=parseFloat(t.value)||0;
 else if(f==='month')cur.month=t.value;
 else{var e=S.emps.filter(function(x){return x.id===t.dataset.id})[0];if(!e)return;
  if(f==='h')cur.hours[e.id]=parseFloat(t.value)||0;
  else if(f==='r')e.r=parseFloat(t.value)||0;
  else e[f]=t.value}
 calc()};
async function persist(okMsg){say('שומר…');try{await saveAll();say(okMsg);renderHist();return true}catch(e){say('השמירה נכשלה, נסה שוב');return false}}
function histBody(f){var ms=emp.d.months.slice().sort(function(a,b){return a.month<b.month?1:-1}).filter(function(x){return f==='all'||(f.indexOf('y:')===0?x.month.slice(0,4)===f.slice(2):x.month===f)}),tb=0,th=0,tsum=0;
 var rows=ms.map(function(x){var n=getNet(x.month);tb+=x.amt;if(n>0&&x.h>0){th+=x.h;tsum+=n+x.amt}
  return '<div class="hm"><div class="top"><span>'+esc(mlabel(x.month))+'</span><span class="amt">'+fmt(x.amt)+' ₪</span></div><div class="det">'+x.h+' שעות · '+x.pct.toFixed(1)+'% · '+x.items.toFixed(1)+' פריטים</div>'+(n>0?'<div class="det">שכר נטו: '+fmt(n)+' ₪'+(x.h?' · סה״כ לשעה: <b>'+fmt((n+x.amt)/x.h)+' ₪</b>':'')+'</div>':'<div class="det">שכר נטו: לא הוזן</div>')+'</div>'}).join('');
 $('hbody').innerHTML='<div class="total" style="margin-top:12px"><span>סה״כ בונוסים</span><span>'+fmt(tb)+' ₪</span></div>'+(th?'<div class="total"><span>ממוצע לשעה (שכר + בונוס)</span><span>'+fmt(tsum/th)+' ₪</span></div>':'')+(rows||'<div class="sum">אין נתונים.</div>')}
var editM=null;
function editMo(){var mo=JSON.parse(JSON.stringify(S.months[editM]));mo.sold=parseFloat($('ed_sold').value)||0;mo.excl=parseFloat($('ed_excl').value)||0;mo.rows.forEach(function(r,i){r.h=parseFloat($('ed_h'+i).value)||0;r.r=parseFloat($('ed_r'+i).value)||0});return mo}
function editPrev(){var r=calcMonth(editMo());$('ed_out').innerHTML='<div class="sum">פריטים לחלוקה: <b>'+r.items+'</b></div>'+r.rows.map(function(x){return '<div class="res"><div>'+esc(x.n)+'<small>'+x.pct.toFixed(1)+'% · '+x.items.toFixed(1)+' פריטים</small></div><div class="amt">'+fmt(x.amt)+' ₪</div></div>'}).join('')+'<div class="total"><span>סה״כ</span><span>'+fmt(r.total)+' ₪</span></div>'}
var act={
 tab:function(b){showLogin(b.dataset.v)},
 go:function(){doLogin()},
 out:function(){S=null;adminPw=null;showLogin('emp')},
 add:function(){S.emps.push({id:'e'+Date.now().toString(36),n:'',r:1.5,pw:'',k:newKey(),has:false});showAdmin();act.o_emps()},
 del:function(b){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='מחק?';setTimeout(function(){b.dataset.sure='';b.textContent='×'},4000);return}
  S.emps=S.emps.filter(function(e){return e.id!==b.dataset.id});gone.push(b.dataset.id);showAdmin();act.o_emps()},
 save:function(){if(!cur.month){say('בחר חודש');return}S.months[cur.month]=JSON.parse(JSON.stringify(curMonth()));persist('נשמר: '+mlabel(cur.month))},
 saveset:function(){persist('ההגדרות נשמרו')},
 refresh:async function(){say('טוען…');await loadNets();renderHist();say('')},
 edit:function(b){editM=b.dataset.m;var mo=S.months[editM];modal(ttl('✏️ עריכת '+esc(mlabel(editM)))+'<div class="grid"><div><label>פריטים שנמכרו</label><input id="ed_sold" data-e="1" type="number" inputmode="decimal" value="'+mo.sold+'"></div><div><label>פריטים שלא נספרים</label><input id="ed_excl" data-e="1" type="number" inputmode="decimal" value="'+mo.excl+'"></div></div><label style="margin-top:12px">שעות ובונוס לפריט (₪) לכל עובד</label>'+mo.rows.map(function(r,i){return '<div class="nm" style="grid-template-columns:1fr 85px 85px;margin-top:8px"><div style="align-self:center">'+esc(r.n)+'</div><input id="ed_h'+i+'" data-e="1" type="number" inputmode="decimal" placeholder="שעות" value="'+r.h+'"><input id="ed_r'+i+'" data-e="1" type="number" step="0.01" inputmode="decimal" placeholder="₪" value="'+r.r+'"></div>'}).join('')+'<div id="ed_out" style="margin-top:12px"></div><button data-a="saveed" style="width:100%">שמור שינויים</button><div id="msg" class="sum"></div>');editPrev()},
 saveed:function(){S.months[editM]=editMo();persist('נשמר').then(function(ok){if(ok)setTimeout(function(){act.o_adm()},700)})},
 o_calc:function(){modal(ttl('📅 חישוב החודש')+'<div class="grid"><div><label>פריטים שנמכרו</label><input data-f="sold" type="number" inputmode="decimal" value="'+(cur.sold||'')+'"></div><div><label>פריטים שלא נספרים</label><input data-f="excl" type="number" inputmode="decimal" value="'+(cur.excl||'')+'"></div></div><div style="margin:10px 0"><label>חודש</label><input data-f="month" type="month" value="'+cur.month+'"></div><label>שעות עבודה החודש</label>'+S.emps.map(function(e){return '<div class="nm" style="grid-template-columns:1fr 110px;margin-top:8px"><div style="align-self:center">'+esc(e.n||'ללא שם')+'</div><input data-f="h" data-id="'+esc(e.id)+'" type="number" inputmode="decimal" placeholder="שעות" value="'+(cur.hours[e.id]||'')+'"></div>'}).join('')+'<div id="out" style="margin-top:14px"></div><button data-a="save" style="width:100%">שמור חודש</button><div id="msg" class="sum"></div>');calc()},
 o_emps:function(){modal(ttl('👥 עובדים ותעריפים')+'<label>שם · בונוס לפריט (₪) · סיסמה (ריק = ללא שינוי)</label>'+S.emps.map(function(e){return '<div class="er"><div class="nm"><input data-f="n" data-id="'+esc(e.id)+'" value="'+esc(e.n)+'" placeholder="שם"><button class="x" data-a="del" data-id="'+esc(e.id)+'" aria-label="מחק">×</button></div><div class="g3" style="grid-template-columns:1fr 1.6fr"><input data-f="r" data-id="'+esc(e.id)+'" type="number" inputmode="decimal" step="0.01" placeholder="₪" value="'+e.r+'"><input data-f="pw" data-id="'+esc(e.id)+'" placeholder="'+(e.has?'סיסמה חדשה':'קבע סיסמה')+'" value="'+esc(e.pw)+'"></div></div>'}).join('')+'<button data-a="add" class="alt">+ הוסף עובד</button><div class="sum">עובד בלי סיסמה לא יכול להיכנס. כל עובד יכול להחליף את הסיסמה שלו בעצמו, וכאן אפשר לאפס אותה.</div><button data-a="saveset" style="width:100%">שמור הגדרות</button><div id="msg" class="sum"></div>')},
 o_adm:function(){modal(ttl('📜 היסטוריה')+'<div id="hist"></div>');renderHist()},
 o_msgs:function(){modal(ttl('✉️ הודעות')+'<label>שליחת הודעה</label><select id="mto"><option value="all">כל העובדים</option>'+S.emps.map(function(e){return '<option value="'+esc(e.id)+'">'+esc(e.n)+'</option>'}).join('')+'</select><textarea id="mtx" rows="3" placeholder="כתוב הודעה…"></textarea><button data-a="send" style="width:100%">שלח</button><div id="mmsg" class="sum"></div><label style="margin-top:10px">הודעות שנשלחו</label><div id="mlist"></div>');renderMsgs()},
 o_sett:function(){modal(ttl('🔐 סיסמת מנהל')+'<label>סיסמת מנהל חדשה</label><input id="np" type="password"><button data-a="pwset" style="width:100%">החלף סיסמה</button><div id="msg" class="sum"></div>')},
 histopen:function(){var ms=emp.d.months.map(function(x){return x.month}).sort().reverse(),ys=[];ms.forEach(function(m){var y=m.slice(0,4);if(ys.indexOf(y)<0)ys.push(y)});
  var o='<option value="all">כל החודשים</option>'+ys.map(function(y){return '<option value="y:'+y+'">כל שנת '+y+'</option>'}).join('')+ms.map(function(m){return '<option value="'+m+'">'+esc(mlabel(m))+'</option>'}).join('');
  var m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML='<div class="mbox big"><div style="font-size:1.15rem;font-weight:700;margin-bottom:8px">📜 ההיסטוריה שלי</div><label>בחר מה להציג</label><select data-f="hf">'+o+'</select><div id="hbody"></div><button data-a="pwclose" class="alt" style="width:100%">סגור</button></div>';$('app').appendChild(m);histBody('all')},
 pwopen:function(){var m=document.createElement('div');m.id='modal';m.className='modal';m.dataset.a='';m.innerHTML='<div class="mbox"><div style="font-size:1.15rem;font-weight:700;margin-bottom:6px">🔑 החלפת סיסמה</div><input id="op" type="password" placeholder="סיסמה נוכחית" autocomplete="current-password"><input id="np1" type="password" placeholder="סיסמה חדשה (לפחות 6 תווים)" autocomplete="new-password"><input id="np2" type="password" placeholder="הקלד שוב את הסיסמה החדשה" autocomplete="new-password"><div id="pmsg" class="sum"></div><div class="grid"><button data-a="chpw" style="margin:0">החלף</button><button class="alt" data-a="pwclose" style="margin:0">ביטול</button></div></div>';$('app').appendChild(m);$('op').focus()},
 pwclose:function(){var m=$('modal');if(m)m.remove()},
 chpw:async function(){var o=$('op').value,n=$('np1').value,m=$('pmsg');if(!o||!n){m.textContent='הזן סיסמה נוכחית וחדשה';return}if($('np2').value!==n){m.textContent='הסיסמאות החדשות לא תואמות';return}if(n.length<6){m.textContent='סיסמה חדשה: לפחות 6 תווים';return}
  m.textContent='בודק…';try{var wr=await col3.doc(emp.id).get();if(!wr.exists){m.textContent='שגיאה';return}
  try{await unseal(wr.data(),o)}catch(e){m.textContent='הסיסמה הנוכחית שגויה';return}
  await col3.doc(emp.id).set(await seal({k:emp.k},n));$('op').value='';$('np1').value='';m.textContent='הסיסמה הוחלפה. בכניסה הבאה השתמש בחדשה.';setTimeout(function(){var mm=$('modal');if(mm)mm.remove()},1800)}catch(e){m.textContent='ההחלפה נכשלה ('+((e&&(e.code||e.message))||'שגיאה')+')'}},
 send:function(){var tx=$('mtx').value.trim(),to=$('mto').value,mm=$('mmsg');if(!tx){mm.textContent='כתוב הודעה';return}
  S.msgs=S.msgs||[];S.msgs.push({id:'g'+Date.now().toString(36),t:Date.now(),to:to,text:tx});mm.textContent='שולח…';
  saveAll().then(function(){$('mtx').value='';mm.textContent='נשלח. עובד שאין לו סיסמה לא יקבל את ההודעה.';renderMsgs()}).catch(function(){mm.textContent='השליחה נכשלה, נסה שוב'})},
 delmsg:function(b){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='לחץ שוב למחיקה';setTimeout(function(){b.dataset.sure='';b.textContent='מחק'},4000);return}
  S.msgs=(S.msgs||[]).filter(function(m){return m.id!==b.dataset.id});saveAll().then(renderMsgs).catch(function(){b.textContent='נכשל'})},
 pwset:function(){var p=$('np').value;if(p.length<6){say('סיסמה חדשה: לפחות 6 תווים');return}adminPw=p;persist('סיסמת המנהל הוחלפה')},
 load:function(b){var mo=S.months[b.dataset.m];cur.month=b.dataset.m;cur.sold=mo.sold;cur.excl=mo.excl;cur.hours={};mo.rows.forEach(function(r){cur.hours[r.id]=r.h});showAdmin();act.o_calc()},
 rm:function(b){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='לחץ שוב למחיקה';setTimeout(function(){b.dataset.sure='';b.textContent='מחק'},4000);return}
  delete S.months[b.dataset.m];persist('החודש נמחק')}
};
$('app').onclick=function(ev){if(ev.target.id==='modal'){act.pwclose();return}var b=ev.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b)};
init();
</script>
