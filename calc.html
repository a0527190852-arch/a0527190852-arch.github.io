<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מחשבון מבצעים</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap">
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#0d4f73;--mut:#8a8176;--gold:#b08a1a;--bd:#eadfcb;--navy:#0d5073;--onnavy:#fff;--inp:#fbf8f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#1e232b;--tx:#e8eef3;--mut:#a19a8d;--gold:#d4aa3a;--bd:#323944;--navy:#2c7aa5;--inp:#171b21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--card:#1e232b;--tx:#e8eef3;--mut:#a19a8d;--gold:#d4aa3a;--bd:#323944;--navy:#2c7aa5;--inp:#171b21;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:18px 16px 40px;max-width:520px;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);font-weight:700;font-size:17px;margin:6px 0 18px}
.top i{flex:0 0 60px;height:2px;background:var(--gold)}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:34px;text-align:center;margin:0 0 6px;color:var(--navy)}
.logo{background:#faf6ef;border-radius:14px;padding:4px 8px;margin:0 0 10px;text-align:center}.logo img{max-width:100%;height:auto;display:block;margin:auto}
.sub{text-align:center;color:var(--mut);font-size:19px;margin:0 0 22px}
.card{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:18px 18px 22px;margin-bottom:18px}
.code{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:17px;direction:ltr;text-align:right}
.ttl{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:24px;color:var(--navy);margin:8px 0 10px}
.badge{position:absolute;left:-10px;bottom:-14px;width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:900;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
label{display:block;font-size:15px;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;box-sizing:border-box;font:inherit;font-size:19px;padding:13px;border-radius:9px;border:2px solid var(--bd);background:var(--inp);color:var(--tx)}
.row{display:flex;gap:10px}.row>div{flex:1}
.res{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--bd);font-size:17px}
.res:last-of-type{border:0}
.gold{color:var(--gold);font-weight:700}
.pay{background:var(--navy);color:#fff;border-radius:9px;padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.pay b{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:30px;font-weight:900}
.mut{color:var(--mut);font-size:14px;margin-top:10px}
</style>
</head>

<p class="sub">הזינו את פרטי המבצע כדי להתחיל</p>

<div class="card"><div class="code">M – 01</div><div class="ttl">סוג המבצע</div>
  <select id="type">
    <option value="p50">הפריט השני ב־50% הנחה</option>
    <option value="p30">הפריט השני ב־30% הנחה</option>
    <option value="pc">הפריט השני – אחוז הנחה אחר</option>
    <option value="amt">הפריט השני – הנחה בשקלים</option>
  </select>
  <div id="cw" style="display:none"><label id="cl">ערך ההנחה</label><input id="cv" type="number" inputmode="decimal" value="40"></div>
  <div class="badge">%</div>
</div>

<div class="card"><div class="code">P – 02</div><div class="ttl">מחירי המוצרים</div>
  <div class="row">
    <div><label>המוצר היקר (₪)</label><input id="a" type="number" inputmode="decimal" placeholder="100"></div>
    <div><label>המוצר הזול (₪)</label><input id="b" type="number" inputmode="decimal" placeholder="60"></div>
  </div>
  <div class="mut">ההנחה מחושבת על המוצר הזול מבין השניים.</div>
  <div class="badge">₪</div>
</div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id),f=n=>n.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
function calc(){
  const t=$('type').value;
  $('cw').style.display=(t==='pc'||t==='amt')?'block':'none';
  $('cl').textContent=t==='amt'?'סכום ההנחה (₪)':'אחוז ההנחה (%)';
  let x=parseFloat($('a').value),y=parseFloat($('b').value);
  if(!(x>0)||!(y>0)){$('out').innerHTML='';return}
  const hi=Math.max(x,y),lo=Math.min(x,y),sum=hi+lo,cv=parseFloat($('cv').value)||0;
  let d=t==='p50'?lo*.5:t==='p30'?lo*.3:t==='pc'?lo*cv/100:cv;
  d=Math.min(Math.max(d,0),lo);
  const rd=n=>Math.floor(n+0.5+1e-9),w=n=>n.toLocaleString('he-IL');
  const exact=p=>p-d*p/sum;
  const pHi=rd(exact(hi)),pLo=rd(exact(lo)),tot=pHi+pLo;
  const person=(code,n,p,pr)=>{const sh=p/sum,ex=exact(p),dd=p-pr;return `<div class="card"><div class="code">${code}</div><div class="ttl">${n} · ${f(p)} ₪</div>
  <div class="res"><span>חלקו בעסקה</span><b>${f(sh*100)}%</b></div>
  <div class="res"><span>ההנחה שלו</span><span class="gold">${f(dd)} ₪ (${f(dd/p*100)}%)</span></div>
  <div class="res"><span>לפני עיגול</span><span>${f(ex)} ₪</span></div>
  <div class="pay"><span>צריך לשלם</span><b>${w(pr)} ₪</b></div></div>`};
  $('out').innerHTML=person('R – 03','לקוח 1 (היקר)',hi,pHi)+person('R – 04','לקוח 2 (הזול)',lo,pLo)+
  `<div class="card"><div class="code">T – 05</div><div class="ttl">סיכום העסקה</div>
  <div class="res"><span>לפני הנחה</span><b>${f(sum)} ₪</b></div>
  <div class="res"><span>סך ההנחה</span><span class="gold">${f(sum-tot)} ₪</span></div>
  <div class="pay"><span>סך הכל לתשלום</span><b>${w(tot)} ₪</b></div>
  <div class="mut">ההנחה מתחלקת יחסית לשווי כל מוצר. כל לקוח מעוגל לשקל שלם: עד 49 אגורות כלפי מטה, מ־50 אגורות כלפי מעלה.</div></div>`;
}
['type','a','b','cv'].forEach(i=>$(i).addEventListener('input',calc));
</script>
</body>
</html>
