<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1a1d26;--muted:#6b7280;--accent:#2563eb;--line:#e5e7eb;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1b1e26;--text:#eef0f5;--muted:#9aa1b0;--accent:#6ea0ff;--line:#2d313c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111318;--card:#1b1e26;--text:#eef0f5;--muted:#9aa1b0;--accent:#6ea0ff;--line:#2d313c;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:1.4rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;font-size:1rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:6px}
.er{border-bottom:1px solid var(--line);padding:10px 0}
.nm{display:grid;grid-template-columns:1fr auto;gap:8px}
button{font-size:1rem;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer;margin-top:8px}
button.alt{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.x{background:transparent;color:var(--muted);padding:6px 10px;font-size:1.2rem;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tabs button{margin:0;background:var(--card);color:var(--text);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sum{font-size:.95rem;color:var(--muted);margin:8px 0}
.sum b{color:var(--text)}
.res{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px}
.res small{color:var(--muted);display:block}
.amt{font-size:1.2rem;font-weight:700;color:var(--ok);white-space:nowrap}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:2px solid var(--line);padding-top:10px}
.hm{border-top:1px solid var(--line);padding:10px 0}.hm .top{display:flex;justify-content:space-between;font-weight:700}.hm .det{color:var(--muted);font-size:.9rem;margin:4px 0}
.hm button{padding:6px 10px;font-size:.85rem;margin-inline-end:6px}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.45}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:22px;padding:18px 20px;margin:6px 0 18px;box-shadow:0 10px 28px rgba(79,70,229,.30)}
.hero .ic{font-size:2rem;background:rgba(255,255,255,.18);width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.hero h1{margin:0;font-size:1.45rem;font-weight:700;color:#fff}
.hero p{margin:2px 0 0;font-size:.9rem;opacity:.85}
.card{border-radius:20px;box-shadow:0 4px 18px rgba(20,30,60,.08);padding:16px}
label{font-weight:500;letter-spacing:.2px;margin-bottom:6px}
input,select{border-radius:12px;padding:12px;border:1.5px solid var(--line);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.22)}
button{background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:12px;font-family:inherit;font-weight:500;box-shadow:0 4px 12px rgba(79,70,229,.25);transition:transform .1s,opacity .15s}
button:active{transform:scale(.97)}
button.alt,button.x,.tabs button{box-shadow:none}
.tabs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;gap:5px}
.tabs button{border:0;background:transparent;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.res{border-top:1px dashed var(--line);align-items:center}
.res small{font-size:.82rem;margin-top:2px}
.amt{background:rgba(34,197,94,.14);padding:4px 12px;border-radius:999px;font-size:1.05rem}
.total{background:var(--bg);border:0;border-radius:14px;padding:14px;margin-top:10px;font-size:1.1rem}
.total span:last-child{color:var(--ok)}
.hm{border-top:1px dashed var(--line)}
.er{border-bottom:1px dashed var(--line)}
html:root:not([data-theme="x"]){--bg:#0d0d0f;--card:#17171b;--text:#f3ede0;--muted:#a49b86;--accent:#d4af37;--line:#2c2a22;--ok:#e6c35c;color-scheme:dark}
body{background:radial-gradient(900px 420px at 50% -120px,rgba(212,175,55,.16),transparent) var(--bg) no-repeat}
.hero{background:linear-gradient(135deg,#221d0c,#0d0d0f);border:1px solid rgba(212,175,55,.45);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.hero .ic{background:linear-gradient(135deg,#f5d66b,#b8860b);box-shadow:0 4px 14px rgba(212,175,55,.35)}
.hero h1{color:#f5d66b;letter-spacing:.3px}
.hero p{color:#cbbf9d;opacity:1}
.card{box-shadow:0 6px 22px rgba(0,0,0,.45);border-color:#2c2a22}
label{color:#b9ae92}
input:focus,select:focus{box-shadow:0 0 0 3px rgba(212,175,55,.25)}
button{background:linear-gradient(135deg,#f5d66b,#b8860b);color:#1a1405;font-weight:700;box-shadow:0 4px 14px rgba(212,175,55,.25)}
.tabs button.on{background:linear-gradient(135deg,#f5d66b,#b8860b);color:#1a1405;box-shadow:0 4px 14px rgba(212,175,55,.25)}
.amt{background:rgba(212,175,55,.14);color:#f5d66b;border:1px solid rgba(212,175,55,.3)}
.total{background:#101013;border:1px solid rgba(212,175,55,.25)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.mbox{background:var(--card);border:1px solid rgba(212,175,55,.45);border-radius:20px;padding:18px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.mbox.big{max-height:88vh;overflow:auto}
.mbox.wide{max-width:520px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 10px;margin:0;font-size:1rem;background:var(--card);color:var(--text);border:1px solid rgba(212,175,55,.35);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tile span{font-size:2rem;line-height:1}
.tile:last-child{grid-column:1/-1}
.mbox input{margin-top:8px}
.total span:last-child{color:#f5d66b}
textarea{width:100%;font-family:inherit;font-size:1rem;padding:12px;margin-top:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,175,55,.25)}

html:root:not([data-theme="x"]){--bg:#faf6ee;--card:#fff;--text:#0f3f5c;--muted:#7a7468;--accent:#0d5075;--line:#ebe3d2;--ok:#0d5075;color-scheme:light}
body{background:radial-gradient(700px 380px at 50% 0,#f3ead6,transparent) var(--bg) no-repeat}
.brand{text-align:center;margin:8px 0 16px}
.kicker{display:flex;align-items:center;justify-content:center;gap:12px;color:#a98418;font-weight:700;font-size:.95rem;letter-spacing:.3px}
.kicker i{display:block;width:44px;height:2px;background:#c9a227;opacity:.8}
.logo{font-family:'Frank Ruhl Libre',serif;font-size:3.4rem;line-height:1.1;margin-top:10px;font-weight:700}
.logo .b{color:#0d5075}.logo .g{color:#c9a227;font-style:italic;margin-inline-start:4px}
.greet{font-family:'Frank Ruhl Libre',serif;text-align:center;font-size:1.7rem;font-weight:700;color:#0f3f5c;margin:6px 0 4px}
.subt{text-align:center;color:var(--muted);font-size:1.05rem;margin-bottom:22px}
.card{border-color:var(--line);box-shadow:0 2px 10px rgba(80,60,20,.06)}
label{color:var(--muted)}
input:focus,select:focus,textarea:focus{border-color:#0d5075;box-shadow:0 0 0 3px rgba(13,80,117,.18)}
button{background:#0d5075;color:#fff;box-shadow:none;font-weight:700}
.amt{background:rgba(13,80,117,.08);color:#0d5075;border:1px solid rgba(13,80,117,.2)}
.total{background:#f6f0e2;border:1px solid var(--line)}
.total span:last-child{color:#0d5075}
.modal{background:rgba(15,40,60,.5)}
.mbox{border-color:var(--line);box-shadow:0 20px 50px rgba(15,40,60,.3)}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin-bottom:18px;padding-bottom:10px}
.opt{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 16px 18px;box-shadow:0 2px 10px rgba(80,60,20,.06);cursor:pointer}
.opt:last-child{grid-column:1/-1}
.otop{display:flex;justify-content:space-between;align-items:center}
.code{color:#a98418;font-weight:700;letter-spacing:1.5px;direction:ltr}
.rad{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:#fbf8f1}
.otitle{font-family:'Frank Ruhl Libre',serif;font-size:1.35rem;font-weight:700;color:#0f3f5c;margin:14px 0 16px;line-height:1.2}
.opt button{width:100%;margin:0;padding:14px 8px;border-radius:10px;font-size:1rem;pointer-events:none}
.ico{position:absolute;left:-12px;bottom:-14px;width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(80,60,20,.15);display:grid;place-items:center;font-size:1.4rem}
.logoimg{display:block;margin:6px auto 4px;max-width:80%;height:auto}
.brand{margin:14px 0 18px}
</style>
